{% if stat_cards %}
<div class="stats-container">
    <div class="stats">
        {% for stat in stat_cards %}
            <div class="stat-card" data-index="{{ forloop.counter0 }}" role="button" tabindex="0" aria-label="View {{ stat.label }}" style="--stat-accent: {{ stat.icon_color_rgb }};" {% if stat.scroll_to %}data-scroll-to="{{ stat.scroll_to }}"{% endif %}>
                <div class="stat-icon">
                    {% if stat.icon_type == 'font_awesome' and stat.icon %}
                        <i class="fas fa-{{ stat.icon }}" style="color: {{ stat.icon_color }};"></i>
                    {% elif stat.icon_type == 'image' and stat.icon_image %}
                        <img src="{{ stat.icon_image.url }}" alt="{{ stat.label }}" class="custom-icon">
                    {% else %}
                        <i class="fas fa-question-circle" style="color: #6c757d;"></i>
                    {% endif %}
                </div>
                <div class="stat-number" data-target="{{ stat.number }}">0</div>
                <div class="stat-label">{{ stat.label }}</div>
            </div>
        {% endfor %}
    </div>
</div>


<style>
.stats-container {
    background: linear-gradient(180deg, #f8fafc 0, #ffffff 42px);
    padding: clamp(36px, 4vw, 52px) 20px 30px;
    margin: 0;
    position: relative;
    border-top: 1px solid rgba(15, 23, 42, 0.04);
}

/* Override the banner's old zero-spacing sibling rule. */
.banner-slider-container + .stats-container {
    padding-top: clamp(20px, 2.5vw, 34px) !important;
}


.stats {
    display: flex;
    justify-content: space-evenly;
    align-items: stretch;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px;
    gap: 20px;
    perspective: 1000px;
}


.stat-card {
    --stat-accent: 37, 99, 235;
    text-align: center;
    flex: 1;
    max-width: 200px;
    padding: 28px 18px;
    border-radius: 16px;
    background: linear-gradient(145deg, #ffffff, #f8fafc);
    border: 1px solid rgba(var(--stat-accent), 0.14);
    box-shadow: 0 7px 20px rgba(15, 23, 42, 0.06);
    position: relative;
    overflow: hidden;
    cursor: pointer;

    /* Transitions */
    transition:
        transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1),
        background 0.3s ease,
        border-color 0.3s ease;

    /* Entry animation */
    opacity: 1;
    transform: translateY(0);
    animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) backwards;
}

/* Staggered animation delay */
.stat-card[data-index="0"] { animation-delay: 0.1s; }
.stat-card[data-index="1"] { animation-delay: 0.2s; }
.stat-card[data-index="2"] { animation-delay: 0.3s; }
.stat-card[data-index="3"] { animation-delay: 0.4s; }
.stat-card[data-index="4"] { animation-delay: 0.5s; }
.stat-card[data-index="5"] { animation-delay: 0.6s; }


@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* ── Hover — lift UP ── */
.stat-card:hover {
    transform: translateY(-10px) scale(1.025);
    box-shadow:
        0 20px 40px rgba(var(--stat-accent), 0.16),
        0 8px 18px rgba(15, 23, 42, 0.08);
    background: #ffffff;
    border-color: rgba(var(--stat-accent), 0.42);
}

.stat-card:focus-visible {
    outline: 3px solid rgba(var(--stat-accent), 0.25);
    outline-offset: 4px;
    transform: translateY(-5px);
}


/* ── Active / Click — press DOWN ── */
.stat-card:active {
    transform: translateY(4px) scale(0.97);
    box-shadow:
        0 1px 4px rgba(0,0,0,0.12),
        inset 0 2px 6px rgba(0,0,0,0.08);
    background: rgba(240, 242, 245, 0.95);
    border-color: rgba(0,0,0,0.18);
    transition:
        transform 0.08s cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 0.08s ease,
        background 0.08s ease;
}


/* ── JS-driven pressed state (touch devices) ── */
.stat-card.pressed {
    transform: translateY(4px) scale(0.97) !important;
    box-shadow:
        0 1px 4px rgba(0,0,0,0.12),
        inset 0 2px 6px rgba(0,0,0,0.08) !important;
    background: rgba(240, 242, 245, 0.95) !important;
    border-color: rgba(0,0,0,0.18) !important;
    transition:
        transform 0.08s cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 0.08s ease !important;
}


/* ── Icon ── */
.stat-icon {
    font-size: 48px;
    margin-bottom: 14px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    z-index: 1;
}

.stat-icon::before {
    content: '';
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--stat-accent), 0.16), transparent 68%);
    opacity: 0;
    transform: scale(0.55);
    transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: -1;
}


.stat-card:hover .stat-icon {
    transform: translateY(-3px) scale(1.12) rotate(4deg);
}

.stat-card:hover .stat-icon::before {
    opacity: 1;
    transform: scale(1);
}


.stat-card:active .stat-icon,
.stat-card.pressed .stat-icon {
    transform: scale(0.95) translateY(2px);
    transition: transform 0.08s ease;
}


.stat-icon i {
    font-size: inherit;
    animation: iconPulse 2s ease-in-out infinite;
}


@keyframes iconPulse {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.05); }
}


.stat-card:hover .stat-icon i,
.stat-card:active .stat-icon i,
.stat-card.pressed .stat-icon i {
    animation: none;
    transform: scale(1);
}


.stat-icon .custom-icon {
    width: 52px;
    height: 48px;
    object-fit: contain;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}


.stat-card:hover .stat-icon .custom-icon {
    transform: scale(1.1);
}


.stat-card:active .stat-icon .custom-icon,
.stat-card.pressed .stat-icon .custom-icon {
    transform: scale(0.95) translateY(2px);
    transition: transform 0.08s ease;
}


/* ── Number ── */
.stat-number {
    font-family: var(--font-sans);
    font-size: 17px;
    font-weight: 800;
    color: #1a202c;
    line-height: 1;
    letter-spacing: -1.2px;
    text-rendering: optimizeLegibility;
    transition: color 0.3s ease, transform 0.3s ease;
    margin-bottom: 6px;
}


.stat-card:hover .stat-number {
    color: rgb(var(--stat-accent));
    transform: translateY(-1px);
}


.stat-card:active .stat-number,
.stat-card.pressed .stat-number {
    color: #1d4ed8;
}


/* ── Label ── */
.stat-label {
    font-family: var(--font-sans);
    font-size: 16px;
    color: #64748b;
    font-weight: 700;
    line-height: 1.3;
    margin: 0;
    letter-spacing: 0.1px;
    transition: color 0.3s ease;
}


.stat-card:hover .stat-label {
    color: #475569;
}


.stat-card:active .stat-label,
.stat-card.pressed .stat-label {
    color: #334155;
}


/* ── Shimmer on hover ── */
.stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(var(--stat-accent), 0.09), transparent);
    transition: left 0.65s ease;
    pointer-events: none;
    z-index: 2;
}


.stat-card:hover::before {
    left: 100%;
}

.stat-card::after {
    content: '';
    position: absolute;
    top: 0;
    left: 18px;
    right: 18px;
    height: 3px;
    border-radius: 0 0 999px 999px;
    background: rgb(var(--stat-accent));
    transform: scaleX(0);
    transform-origin: center;
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.stat-card:hover::after,
.stat-card:focus-visible::after {
    transform: scaleX(1);
}


/* No shimmer while pressing */
.stat-card:active::before,
.stat-card.pressed::before {
    left: -100%;
    transition: none;
}


/* ════════════ Responsive ════════════ */
@media (max-width: 1024px) {
    .stats-container { padding: 38px 20px 30px; }
    .stats { padding: 0 15px; gap: 18px; max-width: 950px; }
    .stat-card { max-width: 170px; padding: 24px 16px; }
    .stat-icon { font-size: 42px; height: 50px; margin-bottom: 12px; }
    .stat-icon .custom-icon { width: 46px; height: 42px; }
    .stat-number { font-size: 17px; margin-bottom: 8px; letter-spacing: -1px; }
    .stat-label { font-size: 15px; }
}


@media (max-width: 768px) {
    .stats-container { padding: 32px 15px 26px; }
    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        padding: 0 12px;
        max-width: 560px;
    }
    .stat-card { max-width: none; width: 100%; padding: 16px 10px; }
    .stat-icon { font-size: 30px; height: 36px; margin-bottom: 8px; }
    .stat-icon .custom-icon { width: 32px; height: 30px; }
    .stat-number { font-size: 15px; margin-bottom: 5px; letter-spacing: -0.6px; }
    .stat-label { font-size: 12px; line-height: 1.3; }
}


@media (max-width: 480px) {
    .stats-container { padding: 26px 10px 22px; }
    .stats { gap: 8px; padding: 0 8px; max-width: 420px; }
    .stat-card { padding: 12px 6px; border-radius: 12px; }
    .stat-icon { font-size: 24px; height: 30px; margin-bottom: 6px; }
    .stat-icon .custom-icon { width: 26px; height: 24px; object-fit: contain; }
    .stat-number { font-size: 13px; margin-bottom: 4px; letter-spacing: -0.4px; }
    .stat-label { font-size: 10px; line-height: 1.25; }
}


@media (max-width: 360px) {
    .stats { gap: 6px; padding: 0 6px; }
    .stat-card { padding: 10px 4px; }
    .stat-icon { font-size: 20px; height: 26px; margin-bottom: 5px; }
    .stat-icon .custom-icon { width: 22px; height: 20px; }
    .stat-number { font-size: 12px; }
    .stat-label { font-size: 9px; }
}


/* Accessibility */
@media (prefers-reduced-motion: reduce) {
    .stat-card,
    .stat-icon,
    .stat-icon i,
    .stat-icon .custom-icon,
    .stat-number,
    .stat-label {
        animation: none !important;
        transition: none !important;
    }
    .stat-card { opacity: 1; transform: none; }
    .stat-card:active,
    .stat-card.pressed { transform: none !important; box-shadow: none !important; }
}
</style>


<script>
document.addEventListener('DOMContentLoaded', function () {

    /* ── Counter animation ── */
    function animateCounter(element, target, duration = 2000) {
        const endValue  = parseInt(target.replace(/,/g, ''));
        const hasComma  = target.includes(',');
        const hasPlus   = target.includes('+');
        const startTime = performance.now();

        function update(now) {
            const progress = Math.min((now - startTime) / duration, 1);
            const eased    = 1 - Math.pow(1 - progress, 4);
            const current  = Math.floor(endValue * eased);

            let display = hasComma ? current.toLocaleString() : current.toString();
            if (hasPlus && progress === 1) display += '+';
            element.textContent = display;

            if (progress < 1) requestAnimationFrame(update);
        }
        requestAnimationFrame(update);
    }

    /* ── Scroll-triggered counter start ── */
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.querySelectorAll('.stat-number').forEach(el => {
                    const target = el.getAttribute('data-target');
                    if (target) setTimeout(() => animateCounter(el, target), 300);
                });
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.2, rootMargin: '0px 0px -50px 0px' });

    const container = document.querySelector('.stats-container');
    if (container) observer.observe(container);

    /* ── Touch press-down effect ── */
    document.querySelectorAll('.stat-card').forEach(card => {
        card.addEventListener('touchstart', () => {
            card.classList.add('pressed');
        }, { passive: true });

        card.addEventListener('touchend', () => {
            setTimeout(() => card.classList.remove('pressed'), 150);
        }, { passive: true });

        card.addEventListener('touchcancel', () => {
            card.classList.remove('pressed');
        }, { passive: true });
    });

    /* ── Click → smooth scroll down ──
       Priority:
         1. data-scroll-to="#section-id"  on the card  → scrolls to that element
         2. No attribute                               → scrolls to next sibling section
    ── */
    document.querySelectorAll('.stat-card').forEach(card => {
        card.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                card.click();
            }
        });

        card.addEventListener('click', function () {
            const targetSelector = card.getAttribute('data-scroll-to');
            let scrollTarget = null;

            if (targetSelector) {
                // Explicit target defined on the card
                scrollTarget = document.querySelector(targetSelector);
            } else {
                // Auto-detect: next visible sibling after .stats-container
                const statsContainer = document.querySelector('.stats-container');
                if (statsContainer) {
                    let next = statsContainer.nextElementSibling;
                    while (next && next.offsetHeight === 0) {
                        next = next.nextElementSibling;
                    }
                    scrollTarget = next;
                }
            }

            if (scrollTarget) {
                // Wait for press-down animation to play (120ms), then scroll
                setTimeout(() => {
                    scrollTarget.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }, 120);
            }
        });
    });

});
</script>
{% endif %}
